# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
channels:
  - conda-forge
  - bioconda
dependencies:
  - python =3.12
  - pip
  - pip:
      # cellpose 4.2.1.1 is the first release carrying cpsam_v2, cpdino and
      # cpdino-vitb. sopa pins `cellpose>=3.0.5` with no upper bound, so this
      # satisfies its own constraint.
      - sopa[cellpose] ==2.2.6
      - cellpose ==4.2.1.1
