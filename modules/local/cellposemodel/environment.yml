# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
channels:
  - conda-forge
  - bioconda
dependencies:
  - python =3.12
  - pip
  - pip:
      # Must match segmentationcellpose: this process stages the weights that
      # one consumes, so a cellpose version skew here would fetch a checkpoint
      # segmentation cannot load.
      - sopa[cellpose] ==2.2.6
      - cellpose ==4.2.1.1
