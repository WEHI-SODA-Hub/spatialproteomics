---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: AVITINUCLEARSEGMENT
description: |
  Segments nuclei for one AVITI tile using Cellpose 3.0.7 with the custom
  20250212_cellpose_nuc_8diam model, pinned separately from the Cellpose v4
  whole-cell environment for compatibility. Output filename matches the AVITI
  Cytocanvas viewer contract (<tile>_Nuclear.tif) so it can be published
  directly under Well<well>/.
keywords:
  - AVITI
  - Teton
  - cytoprofiling
  - cellpose
  - nuclear segmentation
tools:
  - cellpose:
      description: A generalist algorithm for cell and nucleus segmentation, pinned to 3.0.7 for custom model compatibility
      homepage: https://github.com/MouseLand/cellpose
      documentation: https://cellpose.readthedocs.io/
      tool_dev_url: https://github.com/MouseLand/cellpose
      licence: ["BSD-3-Clause"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample/well/tile information
        e.g. [ id:'test__WellA1__L1R01C01S1', tile:'L1R01C01S1' ]
  - nucleus_tif:
      type: file
      description: Nucleus channel TIFF for this tile
      pattern: "*.tif"
  - model_path:
      type: file
      description: Path to the custom 20250212_cellpose_nuc_8diam Cellpose 3.x model file

output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample/well/tile information
        e.g. [ id:'test__WellA1__L1R01C01S1', tile:'L1R01C01S1' ]
  - nuclear_mask:
      type: file
      description: Nuclear segmentation mask for this tile, named after the source tile
      pattern: "*_Nuclear.tif"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@mcmero"
maintainers:
  - "@mcmero"
