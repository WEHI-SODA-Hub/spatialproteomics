---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: AVITIWHOLECELLSEGMENT
description: |
  Segments whole cells/membranes for one AVITI tile using Cellpose v4's
  segment-anything (cpsam) model, from a stacked nucleus + membrane +
  (optional) actin input. Output filename matches the AVITI Cytocanvas
  viewer contract (<tile>_Cell.tif) so it can be published directly under
  Well<well>/.
keywords:
  - AVITI
  - Teton
  - cytoprofiling
  - cellpose
  - segment anything
  - whole-cell segmentation
tools:
  - cellpose:
      description: A generalist algorithm for cell and nucleus segmentation, v4 segment-anything (cpsam) model
      homepage: https://github.com/MouseLand/cellpose
      documentation: https://cellpose.readthedocs.io/
      tool_dev_url: https://github.com/MouseLand/cellpose
      licence: ["BSD-3-Clause"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample/well/tile information
        e.g. [ id:'test__WellA1__L1R01C01S1', tile:'L1R01C01S1' ]
  - nucleus_tif:
      type: file
      description: Nucleus channel TIFF for this tile
      pattern: "*.tif"
  - membrane_tif:
      type: file
      description: Membrane/cell-paint channel TIFF for this tile
      pattern: "*.tif"
  - actin_tif:
      type: file
      description: |
        Actin channel TIFF for this tile (3-channel mode), or a literal
        "NO_FILE" placeholder in 2-channel cell paint mode
      pattern: "*.tif"

output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample/well/tile information
        e.g. [ id:'test__WellA1__L1R01C01S1', tile:'L1R01C01S1' ]
  - cell_mask:
      type: file
      description: Whole-cell segmentation mask for this tile, named after the source tile
      pattern: "*_Cell.tif"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@mcmero"
maintainers:
  - "@mcmero"
