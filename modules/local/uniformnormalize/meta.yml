---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "uniformnormalize"
description: Normalize cellmeasurement-derived numeric features across samples using UniFORM and write normalized GeoJSON files.
keywords:
  - uniform
  - normalization
  - geojson
  - cellmeasurement
  - batch-correction
tools:
  - "uniformnormalize":
      description: "Python wrapper around UniFORM feature-level normalization for cellmeasurement GeoJSON outputs"
      homepage: "https://github.com/kunlunW/UniFORM"
      documentation: "https://github.com/kunlunW/UniFORM#readme"
      tool_dev_url: "https://github.com/kunlunW/UniFORM"
      doi: ""
      licence: "MIT"
      identifier: ""

input:
  - - geojson:
        type: file
        description: One or more GeoJSON files from cellmeasurement
        pattern: "*.geojson"
        ontologies:
          - edam: "http://edamontology.org/format_3464"

output:
  - normalized_annotations:
      - "*_uniform.geojson":
          type: file
          description: GeoJSON files with normalized measurement values (cellmeasurement features only)
          pattern: "*_uniform.geojson"
          ontologies:
            - edam: "http://edamontology.org/format_3464"

  - versions:
      - "versions.yml":
          type: file
          description: File containing software versions
          pattern: "versions.yml"

authors:
  - "@mcmero"
maintainers:
  - "@mcmero"
