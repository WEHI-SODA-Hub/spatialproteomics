name: nf-test
# Runs the nf-test snapshot suite. The `nf-core CI` workflow only runs
# `nextflow run`, which proves the pipeline completes but not that it produces
# the same outputs -- so until this workflow existed, the committed snapshots
# were never executed automatically and could drift unnoticed.
# Manual-dispatch ONLY for now, deliberately. Three tests are still known-red
# for reasons unrelated to this workflow -- segmentationreport and the two
# module-level cellsamsegment tests -- see docs/nf-test-status.md. Wiring this
# to `pull_request` before those are settled would gate every merge on failures
# nobody has diagnosed yet.
#
# To enable once they are: add back
#
#   push:
#     branches: [dev]
#   pull_request:
#   release:
#     types: [published]
#
# and read the "Before enabling nf-test in CI" section of that doc first --
# `process_gpu` tasks request a GPU that ubuntu-latest does not have.
on:
  workflow_dispatch:

env:
  NXF_ANSI_LOG: false
  NFT_VER: "0.9.5"
  CELLPOSE_MODELS_DIR: ${{ github.workspace }}/.cellpose_models
  # Bump when the sopa container (and so the bundled cellpose) changes, to
  # invalidate the weights cache.
  CELLPOSE_CONTAINER: docker.io/quentinblampey/sopa:2.1.11-cellpose

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  nf-test:
    name: "nf-test (${{ matrix.scope }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scope:
          - modules
          - subworkflows
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "24.04.2"

      - name: Install nf-test
        uses: nf-core/setup-nf-test@v1
        with:
          version: "${{ env.NFT_VER }}"
          # Snapshot failures are md5 diffs; pdiff makes them readable.
          install-pdiff: true

      - name: Clean up Disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1

      # The cpsam checkpoint is ~1.2 GB and unpinned upstream, so downloading it
      # per run is both slow and a source of HTTP 429s. Key the cache on the
      # container tag: new container, new cellpose, new weights.
      - name: Restore Cellpose model cache
        id: cellpose-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CELLPOSE_MODELS_DIR }}
          key: cellpose-models-${{ env.CELLPOSE_CONTAINER }}

      - name: Fetch Cellpose model weights
        if: steps.cellpose-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${CELLPOSE_MODELS_DIR}"
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e CELLPOSE_LOCAL_MODELS_PATH=/models \
            -v "${CELLPOSE_MODELS_DIR}:/models" \
            "${CELLPOSE_CONTAINER}" \
            python -c "from cellpose import models; models.CellposeModel(gpu=False)"

      - name: Run nf-test
        env:
          # CELLSAM downloads a gated model; its tests are skipped when the
          # secret is absent, e.g. on pull requests from forks.
          DEEPCELL_ACCESS_TOKEN: ${{ secrets.DEEPCELL_ACCESS_TOKEN }}
        run: |
          nf-test test \
            --profile test,docker \
            --tag ${{ matrix.scope }} \
            --verbose

      - name: Upload nf-test output on failure
        if: failure()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: nf-test-${{ matrix.scope }}-logs
          path: |
            .nf-test/
            .nextflow.log
